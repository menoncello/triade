<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tríade — Tone screen (first launch)</title>
<style>
/* SPINE GOVERNANTE — Tríade Mineral Quente
   DESIGN.md: Brand & Style (forge-room Mineral Quente, incandescente escasso) · Colors (surface #23262D, glow #FFEDC4, tier 1536 #FFD9A0) · Shapes (chamfer lapidary, full-radius só no glow do tone) · Elevation & Depth (feel layer transitório)
   EXPERIENCE.md: Information Architecture (Tone screen: first launch ~2s, tap-to-skip) · Voice and Tone ("controle sobre o caos", sem hype) · State Patterns (First launch; auto-advance pausa com screen reader) · Accessibility Floor (sem pressão de tempo; anúncio VoiceOver) · Key Flows (Lia §1, Beatriz §1) */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0E11;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:#F2EEE3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.device{width:390px;height:844px;background:#23262D;border-radius:54px;border:1px solid #3A3F49;padding:12px;box-shadow:0 24px 64px rgba(0,0,0,.6),0 2px 0 rgba(255,255,255,.04) inset}
.screen{position:relative;width:100%;height:100%;background:#23262D;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#0C0E11;border-radius:9999px}
.tone-tile{width:172px;height:172px;border-radius:10px;background:linear-gradient(135deg,#FFF3DC 0%,#FFD9A0 55%,#E8A33D 100%);color:#1C1206;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;font-weight:800;font-size:48px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35),0 0 64px 12px rgba(255,237,196,.35),0 0 140px 32px rgba(232,163,61,.22);position:relative;clip-path:polygon(8% 0,92% 0,100% 8%,100% 92%,92% 100%,8% 100%,0 92%,0 8%)}
.tone-tile::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.45) 0%,transparent 40%);pointer-events:none}
.glow-ring{position:absolute;width:280px;height:280px;border-radius:9999px;background:radial-gradient(circle,rgba(255,237,196,.28) 0%,rgba(232,163,61,.10) 45%,transparent 70%);pointer-events:none}
.voice{font-size:22px;font-weight:700;letter-spacing:.2px;color:#F2EEE3}
.sub{font-size:13px;font-weight:500;color:#A39C8F}
.skip{position:absolute;bottom:44px;font-size:13px;color:#A39C8F;border:1px solid #3A3F49;background:#2B2F38;border-radius:12px;padding:12px 16px;min-height:44px}
.progress{position:absolute;bottom:120px;width:120px;height:3px;background:#3A3F49;border-radius:9999px;overflow:hidden}
.progress i{display:block;height:100%;width:70%;background:#E8A33D;border-radius:9999px}
.caption{font-size:13px;color:#A39C8F;max-width:340px;text-align:center;line-height:1.5}
.caption b{color:#F2EEE3;font-weight:600}
</style>
</head>
<body>
<div class="device"><div class="screen">
  <div class="notch"></div>
  <div class="glow-ring"></div>
  <div class="tone-tile">768</div>
  <div class="voice">controle sobre o caos</div>
  <div class="sub">control over chaos · Tríade</div>
  <div class="progress"><i></i></div>
  <div class="skip">Toque para pular · Tap to skip</div>
</div></div>
<div class="caption"><b>key-tone</b> — first-launch ~2s, um tile incandescente acende o slate; só a promessa, nenhum outro texto.</div>
</body>
</html>
