name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  engine-test-and-benchmark:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: triade
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: triade/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run engine tests + deterministic benchmark gate (node --test)
        run: node --test

      - name: Coverage report (informational — never gates)
        run: node --test --experimental-test-coverage --test-coverage-include='src/engine/**' --test-coverage-include='src/game/**'
        continue-on-error: true

  web-pwa-engine-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - name: Run web PWA engine suite (node --test, web tests only)
        run: node --test test/game.test.js
