<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#14161f">
  <title>3!</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-180.png">
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="title">3!</h1>
      <div class="scores">
        <div class="score-box">
          <span class="score-label">SCORE</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">BEST</span>
          <span class="score-value" id="best">0</span>
        </div>
      </div>
    </header>

    <main>
      <div class="board" id="board" aria-label="3! game board" role="grid"></div>
    </main>

    <div class="overlay" id="overlay" hidden>
      <div class="overlay-box">
        <h2>Game Over</h2>
        <p class="final-score-label">Final Score</p>
        <p class="final-score" id="final-score">0</p>
        <p class="final-best" id="final-best"></p>
        <button class="play-again" id="play-again">Play again</button>
      </div>
    </div>
  </div>

  <script src="./js/game.js"></script>
  <script src="./js/debug.js"></script>
  <script src="./js/ui.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').catch(function (err) {
          console.error('Service worker registration failed:', err);
        });
      });
    }
  </script>
</body>
</html>
