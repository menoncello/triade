<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tríade — Game portrait HUD</title>
<style>
/* SPINE GOVERNANTE — Tríade Mineral Quente
   DESIGN.md: Colors (13 tiers + ink por tier) · Typography (display 34 score / caption 13 best / preview 20 accent; hierarquia score>preview>best) · Layout & Spacing (portrait band: score centro-topo, best abaixo 4pt, preview canto inferior, pause top-right 48×48) · Elevation & Depth (board recessed; preview raised-rest; tiles tile-rest) · Shapes (chamfer 10pt, grain) · Components (tile, preview-card, pause-button)
   EXPERIENCE.md: HUD & Diegetic UI (portrait D-007; best lane-scoped; preview N3 exato/faixa) · Interaction Primitives (swipe ~20px RNGH Pan; noop silencioso) · Accessibility Floor (ordem anúncio score→preview→best; targets 44) · Responsive & Platform (portrait primário) · Key Flows (Théo §2-3) */
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0C0E11;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif;color:#F2EEE3;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px}
.device{width:390px;height:844px;background:#23262D;border-radius:54px;border:1px solid #3A3F49;padding:12px;box-shadow:0 24px 64px rgba(0,0,0,.6)}
.screen{position:relative;width:100%;height:100%;background:#23262D;border-radius:44px;overflow:hidden;display:flex;flex-direction:column;padding:60px 16px 16px}
.notch{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:120px;height:28px;background:#0C0E11;border-radius:9999px}
.hud-top{display:flex;align-items:flex-start;justify-content:space-between}
.scorebox{text-align:center;flex:1}
.score{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;font-size:34px;font-weight:700}
.best{font-size:13px;font-weight:500;color:#A39C8F;margin-top:4px}
.pause{width:48px;height:48px;min-width:48px;background:#2B2F38;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#F2EEE3;box-shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.30)}
.spacer{width:48px}
.board{margin-top:16px;background:#1A1D23;border-radius:12px;padding:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cell{background:#262A31;border-radius:6px;aspect-ratio:1}
.tile{border-radius:10px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",system-ui,sans-serif;font-weight:800;font-size:32px;box-shadow:0 2px 0 rgba(0,0,0,.35),0 6px 14px rgba(0,0,0,.35);clip-path:polygon(10% 0,90% 0,100% 10%,100% 90%,90% 100%,10% 100%,0 90%,0 10%)}
.t1{background:#EFE3C2;color:#1C1206}.t2{background:#C9963B;color:#1C1206}.t3{background:#E4A53B;color:#1C1206}.t6{background:#E08532;color:#1C1206}.t12{background:#C96E2E;color:#1C1206}.t24{background:#A2521F;color:#F6F0E1}.t48{background:#6E5A45;color:#F6F0E1}.t96{background:#4E5560;color:#F6F0E1}.t192{background:#28A074;color:#1C1206}.t384{background:#157A5C;color:#F6F0E1;font-size:24px}.t768{background:#0E3B2E;color:#F6F0E1;font-size:24px}
.bottom{margin-top:16px;display:flex;align-items:center;justify-content:space-between}
.preview{background:#2B2F38;border:1px solid #3A3F49;border-radius:12px;padding:12px 16px;box-shadow:0 1px 0 rgba(0,0,0,.3),0 8px 20px rgba(0,0,0,.30);text-align:center}
.preview small{display:block;font-size:11px;color:#A39C8F}
.preview b{font-size:20px;color:#E8A33D}
.moves{font-size:13px;color:#A39C8F;text-align:right;line-height:1.6}
.caption{font-size:13px;color:#A39C8F;max-width:360px;text-align:center;line-height:1.5}
.caption b{color:#F2EEE3}
</style>
</head>
<body>
<div class="device"><div class="screen">
  <div class="notch"></div>
  <div class="hud-top"><div class="spacer"></div><div class="scorebox"><div class="score">1.284</div><div class="best">Best · Iniciante · 2.880</div></div><div class="pause">⏸</div></div>
  <div class="board">
    <div class="tile t192">192</div><div class="tile t48">48</div><div class="tile t12">12</div><div class="tile t3">3</div>
    <div class="tile t96">96</div><div class="tile t24">24</div><div class="tile t6">6</div><div class="tile t2">2</div>
    <div class="tile t48">48</div><div class="tile t12">12</div><div class="tile t6">6</div><div class="tile t1">1</div>
    <div class="tile t384">384</div><div class="tile t24">24</div><div class="tile t3">3</div><div class="cell"></div>
  </div>
  <div class="bottom">
    <div class="preview"><small>Próxima · Next</small><b>3 / 6</b></div>
    <div class="moves">Movimento 47 · Move 47<br>Deslize para mover · Swipe</div>
  </div>
</div></div>
<div class="caption"><b>key-game-portrait</b> — HUD banda portrait: score › preview › best, board máximo, pause fora do swipe.</div>
</body>
</html>
