<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tríade — key-gameover</title>
<style>
/*
 * key-gameover.html — Game-over overlay, portrait (390×844), Iniciante lane variant.
 * Spine refs:
 *  EXPERIENCE.md → Component Patterns: Game-over stat row · Button (primary Jogar de novo, secondary Continue)
 *  EXPERIENCE.md → State Patterns: Game over · New record · Death-continue consumed
 *  EXPERIENCE.md → HUD & Diegetic UI (board freezes beneath the scrim; last move visible) · Game Feel & Juice (soft fade, "fall")
 *  EXPERIENCE.md → Key Flows: Lia step 5, Théo step 6, Ana step 4
 *  DESIGN.md → Components: Game-over stat row (record in accent, a number not an event) · Button · Scrim {colors.scrim} at ~70% · Elevation & Depth layer 4
 *  DESIGN.md → Do's and Don'ts: new record highlighted as a number (D-013); Iniciante-only Continue (rewarded ad, once per game over)
 *  Decisions: D-010 (soft fade, stats, single Jogar de novo; Iniciante discreet Continue), D-013 (record = highlighted number)
 */
:root{
  --surface:#23262D; --raised:#2B2F38; --board:#1A1D23; --cell:#262A31;
  --text:#F2EEE3; --muted:#A39C8F; --border:#3A3F49; --accent:#E8A33D;
  --scrim:#0C0E11; --ink-dark:#1C1206; --ink-light:#F6F0E1; --glow:#FFEDC4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0B0C10;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.page{display:flex;flex-direction:column;align-items:center;gap:28px;padding:48px 16px;min-height:100vh}
.annot{display:flex;gap:12px;align-items:baseline;width:100%;max-width:844px;color:#A39C8F;font-size:12px;letter-spacing:.02em}
.annot b{color:#F2EEE3;font-weight:700}
.device{width:390px;height:844px;background:#0C0E11;border-radius:56px;padding:10px;box-shadow:0 30px 80px rgba(0,0,0,.6),0 0 0 1px rgba(255,255,255,.06)}
.screen{position:relative;width:100%;height:100%;background:var(--surface);border-radius:48px;overflow:hidden}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:120px;height:30px;background:#0C0E11;border-radius:0 0 16px 16px;z-index:70}
.home{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:120px;height:4px;border-radius:2px;background:rgba(242,238,227,.45);z-index:70}
.content{position:relative;display:flex;flex-direction:column;align-items:center;height:100%;padding:58px 16px 16px}
.hud{width:100%;display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:12px}
.spacer{width:48px}
.score-wrap{flex:1;text-align:center}
.score{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:34px;font-weight:700;color:var(--text);letter-spacing:.5px;opacity:.9}
.best{margin-top:2px;font-size:13px;font-weight:500;color:var(--muted)}
.board-area{flex:1;display:flex;align-items:center;justify-content:center}
.board{position:relative;width:358px;height:358px;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:8px;padding:8px;background:var(--board);border-radius:12px;box-shadow:0 18px 36px rgba(0,0,0,.5),inset 0 2px 6px rgba(0,0,0,.45)}
.cell{background:var(--cell);border-radius:6px;box-shadow:inset 0 1px 3px rgba(0,0,0,.35)}
.tile{position:relative;display:flex;align-items:center;justify-content:center;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:800;color:var(--ink-dark);border-radius:10px;user-select:none;
  background:
    linear-gradient(135deg,rgba(255,255,255,.20),rgba(255,255,255,.05) 32%,rgba(255,255,255,0) 46%),
    linear-gradient(315deg,rgba(0,0,0,.22),rgba(0,0,0,.04) 42%,rgba(0,0,0,0) 52%),
    repeating-linear-gradient(45deg,rgba(0,0,0,.02) 0 1px,rgba(0,0,0,0) 1px 3px),
    repeating-linear-gradient(-45deg,rgba(0,0,0,.02) 0 1px,rgba(0,0,0,0) 1px 3px),
    var(--fill);
  box-shadow:0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.22);
}
.ink-light{color:var(--ink-light)}
.num-xl{font-size:32px;font-weight:800}
.num-m{font-size:13px;font-weight:700}
.num-s{font-size:9px;font-weight:700}
.t1{--fill:#EFE3C2} .t2{--fill:#C9963B} .t3{--fill:#E4A53B} .t6{--fill:#E08532}
.t12{--fill:#C96E2E} .t24{--fill:#A2521F} .t48{--fill:#6E5A45} .t96{--fill:#4E5560}
.t192{--fill:#28A074} .t384{--fill:#157A5C} .t768{--fill:#0E3B2E}
.t1536{--fill:#FFD9A0} .t3072{--fill:#FFF3DC}
.glow{box-shadow:0 0 26px 9px rgba(255,237,196,.5),0 3px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.4)}
.glow::after{content:"";position:absolute;inset:-6px;border-radius:14px;z-index:-1;background:radial-gradient(closest-side,rgba(255,237,196,.5),rgba(255,237,196,0) 72%)}
/* scrim — {colors.scrim} at ~70% over the frozen board, last move visible (D-010) */
.scrim{position:absolute;inset:0;background:rgba(12,14,17,.7);z-index:40}
/* stats panel — single column, max ~420pt, on surface-raised */
.panel{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;width:358px;max-width:420px;background:var(--raised);border:1px solid var(--border);border-radius:12px;padding:20px 16px 16px}
.statrow{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.lbl{font-size:13px;font-weight:500;color:var(--muted)}
.val{font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;font-weight:700;color:var(--text)}
.val.record{color:var(--accent)}
.record-tag{display:block;margin-top:2px;font-size:11px;font-weight:500;color:var(--accent)}
.btn{width:100%;min-height:48px;border-radius:12px;border:none;font-family:'SF Pro Display',-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--ink-dark);margin-top:12px}
.btn.secondary{margin-top:8px;background:var(--raised);border:1px solid var(--border);color:var(--text);font-weight:500}
</style>
</head>
<body>
<div class="page">
  <div class="annot"><b>key-gameover.html</b> · Game-over overlay · Iniciante lane variant · new record highlighted as a number (D-013) · discreet Continue (D-010)</div>
  <div class="device">
    <div class="screen">
      <div class="notch"></div>
      <div class="home"></div>
      <div class="content">
        <div class="hud">
          <div class="spacer"></div>
          <div class="score-wrap">
            <div class="score">48.210</div>
            <div class="best">Recorde 48.210</div>
          </div>
          <div class="spacer"></div>
        </div>
        <div class="board-area">
          <div class="board">
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="cell"></div>
            <div class="tile t2 ink-dark num-xl" style="grid-area:1/1">2</div>
            <div class="tile t3 ink-dark num-xl" style="grid-area:1/2">3</div>
            <div class="tile t6 ink-dark num-xl" style="grid-area:1/3">6</div>
            <div class="tile t24 ink-light num-xl" style="grid-area:1/4">24</div>
            <div class="tile t12 ink-dark num-xl" style="grid-area:2/1">12</div>
            <div class="tile t48 ink-light num-xl" style="grid-area:2/2">48</div>
            <div class="tile t3 ink-dark num-xl" style="grid-area:2/3">3</div>
            <div class="tile t96 ink-light num-xl" style="grid-area:2/4">96</div>
            <div class="tile t24 ink-light num-xl" style="grid-area:3/1">24</div>
            <div class="tile t192 ink-dark num-xl" style="grid-area:3/2">192</div>
            <div class="tile t6 ink-dark num-xl" style="grid-area:3/3">6</div>
            <div class="tile t768 ink-light num-xl" style="grid-area:3/4">768</div>
            <div class="tile t48 ink-light num-xl" style="grid-area:4/1">48</div>
            <div class="tile t384 ink-light num-xl" style="grid-area:4/2">384</div>
            <div class="tile t1536 ink-dark num-m glow" style="grid-area:4/3">1536</div>
            <div class="tile t12 ink-dark num-xl" style="grid-area:4/4">12</div>
          </div>
        </div>
      </div>
      <div class="scrim"></div>
      <div class="panel">
        <div class="statrow">
          <div class="lbl">Score<span class="record-tag">novo recorde</span></div>
          <div class="val record">48.210</div>
        </div>
        <div class="statrow">
          <div class="lbl">Best</div>
          <div class="val">48.210</div>
        </div>
        <div class="statrow">
          <div class="lbl">Max tile</div>
          <div class="val">1536</div>
        </div>
        <div class="statrow">
          <div class="lbl">Merges</div>
          <div class="val">34</div>
        </div>
        <div class="statrow">
          <div class="lbl">Longest streak</div>
          <div class="val">7</div>
        </div>
        <button class="btn primary">Jogar de novo</button>
        <button class="btn secondary">Continuar</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
